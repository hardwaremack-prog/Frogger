<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Frogger — a 1-bit Mac recreation</title>
<style>
  :root{
    --plastic-1:#DCD7C8;
    --plastic-2:#C7C1AF;
    --plastic-3:#9E9887;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;height:100%;
    background:radial-gradient(ellipse at 50% 20%,#3a3733 0%,#201e1b 60%,#131210 100%);
    font-family:"Helvetica Neue",Arial,sans-serif;
    color:var(--plastic-1);
    -webkit-tap-highlight-color:transparent;
    overflow:auto;
  }
  body{display:flex;align-items:center;justify-content:center;min-height:100%;padding:22px 12px;}
  .rig{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .brandrow{display:flex;align-items:baseline;justify-content:space-between;width:100%;padding:0 6px;}
  .brandrow .name{font-weight:800;letter-spacing:.14em;font-size:13px;color:#8a8578;text-transform:uppercase;}
  .brandrow .model{font-size:11px;letter-spacing:.08em;color:#635e52;}
  .mac{
    position:relative;
    background:linear-gradient(155deg,var(--plastic-1) 0%,var(--plastic-2) 55%,var(--plastic-3) 100%);
    border-radius:22px;padding:26px 26px 18px;
    box-shadow:0 2px 0 rgba(255,255,255,.5) inset,0 -6px 14px rgba(0,0,0,.18) inset,0 24px 50px rgba(0,0,0,.55),0 2px 0 rgba(0,0,0,.4);
  }
  .handle{position:absolute;top:-9px;left:50%;transform:translateX(-50%);width:120px;height:16px;border-radius:0 0 10px 10px;background:linear-gradient(180deg,#8f8a7c,#a9a394);box-shadow:0 3px 4px rgba(0,0,0,.35) inset;}
  .screen-well{
    background:linear-gradient(155deg,#2b2924,#151412);
    border-radius:14px;padding:16px;
    box-shadow:0 3px 8px rgba(0,0,0,.6) inset;
  }
  canvas#scr{
    display:block;
    image-rendering:pixelated;image-rendering:crisp-edges;
    border-radius:6px;background:#fff;cursor:default;touch-action:none;
    box-shadow:0 0 18px rgba(255,255,255,.08);
  }
  .chin{display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding:0 6px;}
  .badge{display:flex;align-items:center;gap:8px;color:#6c675a;font-size:11px;letter-spacing:.12em;font-weight:700;}
  .badge i{display:inline-block;width:14px;height:14px;border-radius:3px;background:linear-gradient(180deg,#5fae45 0 33%,#e9c43a 33% 66%,#d6503a 66%);opacity:.75;}
  .slot{width:38%;height:8px;border-radius:4px;background:linear-gradient(180deg,#5d584c,#8b8576);box-shadow:0 1px 0 rgba(255,255,255,.5);}
  .pad{display:none;gap:8px;justify-content:center;align-items:center;margin-top:4px;user-select:none;-webkit-user-select:none;}
  .pad .grid{display:grid;grid-template-columns:repeat(3,62px);grid-template-rows:repeat(2,52px);gap:6px;}
  .pad button{
    font:700 20px/1 "Helvetica Neue",Arial,sans-serif;color:#2a2822;
    background:linear-gradient(180deg,#e7e2d3,#bdb7a5);border:1px solid #7c776a;border-radius:10px;
    box-shadow:0 3px 0 #6d685b;touch-action:none;
  }
  .pad button:active{transform:translateY(2px);box-shadow:0 1px 0 #6d685b;}
  .pad .side{display:flex;flex-direction:column;gap:6px;margin-left:10px;}
  .pad .side button{width:74px;height:52px;font-size:13px;}
  .help{font-size:12px;color:#7d786b;text-align:center;line-height:1.5;}
  .help b{color:#a39d8c;}
  @media (pointer:coarse){ .pad{display:flex;} }
  body.compact{padding:4px;}
  body.compact .rig{gap:6px;}
  body.compact .brandrow, body.compact .help, body.compact .handle{display:none;}
  body.compact .mac{padding:10px 10px 6px;border-radius:14px;}
  body.compact .screen-well{padding:6px;border-radius:10px;}
  body.compact .chin{margin-top:5px;}
</style>
</head>
<body>
<div class="rig">
  <div class="brandrow"><span class="name">Frogger</span><span class="model">1-bit compact Mac edition</span></div>
  <div class="mac">
    <div class="handle"></div>
    <div class="screen-well"><canvas id="scr" width="512" height="342"></canvas></div>
    <div class="chin"><span class="badge"><i></i>FROG SE</span><span class="slot"></span></div>
  </div>
  <div class="pad" id="pad">
    <div class="grid">
      <span></span><button data-k="up">▲</button><span></span>
      <button data-k="left">◀</button><button data-k="down">▼</button><button data-k="right">▶</button>
    </div>
    <div class="side">
      <button data-k="start">START</button>
      <button data-k="pause">PAUSE</button>
    </div>
  </div>
  <div class="help"><b>Arrow keys / WASD</b> hop · <b>Space</b> start · <b>P</b> pause · <b>M</b> sound · swipe or tap the pad on phones</div>
</div>

<script>
(() => {
"use strict";
const cv = document.getElementById('scr');          // what you see (scaled up)
const dctx = cv.getContext('2d');
const SW = 512, SH = 342;
const buf = document.createElement('canvas'); buf.width=SW; buf.height=SH; // the real 512x342 Mac screen
const ctx = buf.getContext('2d', {willReadFrequently:true});
ctx.imageSmoothingEnabled = false;

/* ---------- crisp whole-number scaling ---------- */
// Every Mac pixel becomes an exact NxN block of real screen pixels, so
// dither patterns and text never shimmer or smear.
let scale = 1;
function fitScreen(){
  const dpr = window.devicePixelRatio || 1;
  const rig = document.querySelector('.rig'), mac = document.querySelector('.mac');
  const body = document.body;
  function room(){
    const cs = getComputedStyle(body);
    const padW = parseFloat(cs.paddingLeft)+parseFloat(cs.paddingRight);
    const padH = parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom);
    return { w: window.innerWidth  - (mac.offsetWidth - cv.offsetWidth) - padW - 2,
             h: window.innerHeight - (rig.offsetHeight - cv.offsetHeight) - padH - 2 };
  }
  const kOf = r => Math.floor(Math.min(r.w*dpr/SW, r.h*dpr/SH));
  body.classList.remove('compact');
  let r = room(), k = kOf(r);
  body.classList.add('compact');
  const rc = room(), kc = kOf(rc);
  if(kc > k){ k = kc; r = rc; } else body.classList.remove('compact');
  const fit = Math.min(r.w/SW, r.h/SH);          // CSS px per Mac pixel if we filled the space
  let cssPer = k/dpr;
  if(k < 1 || (dpr >= 2 && cssPer < fit*0.8)){   // sharp high-DPI screen and whole-number size is much too small:
    cssPer = fit; k = Math.max(1, Math.round(fit*dpr)); // fill the space (fine on high-DPI phones)
  }
  scale = k;
  cv.width = SW*k; cv.height = SH*k;
  cv.style.width = (SW*cssPer)+'px'; cv.style.height = (SH*cssPer)+'px';
  dctx.imageSmoothingEnabled = false;
}
fitScreen();
window.addEventListener('resize', fitScreen);
matchMedia('(resolution: 1dppx)').addEventListener?.('change', fitScreen);

/* ---------- 1-bit helpers ---------- */
const BLACK = '#000', WHITE = '#fff';
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function patternFrom(rows){
  const h=rows.length,w=rows[0].length,c=mkCanvas(w,h),g=c.getContext('2d');
  g.fillStyle=WHITE;g.fillRect(0,0,w,h);g.fillStyle=BLACK;
  rows.forEach((r,y)=>{for(let x=0;x<w;x++) if(r[x]==='#') g.fillRect(x,y,1,1);});
  return ctx.createPattern(c,'repeat');
}
// '#' black, '.' white, ' ' transparent
function bitmap(rows){
  const h=rows.length,w=Math.max(...rows.map(r=>r.length)),c=mkCanvas(w,h),g=c.getContext('2d');
  rows.forEach((r,y)=>{for(let x=0;x<r.length;x++){
    if(r[x]==='#'){g.fillStyle=BLACK;g.fillRect(x,y,1,1);}
    else if(r[x]==='.'){g.fillStyle=WHITE;g.fillRect(x,y,1,1);}
  }});
  return c;
}
function rotated(src,quarter){ // quarter turns clockwise
  const w=src.width,h=src.height,s=(quarter%2)?mkCanvas(h,w):mkCanvas(w,h),g=s.getContext('2d');
  g.translate(s.width/2,s.height/2);g.rotate(quarter*Math.PI/2);g.drawImage(src,-w/2,-h/2);
  return s;
}

const PAT = {
  desk:  patternFrom(['#.','.#']),
  water: patternFrom(['#.#.#.#.','.#.#.#.#','#.#.#.#.','.#.#.#.#','#.#.#.#.','.#.#.#.#','#.#.#.#.','........']),
  waterAlt: patternFrom(['.#.#.#.#','#.#.#.#.','.#.#.#.#','#.#.#.#.','.#.#.#.#','#.#.#.#.','.#.#.#.#','........']),
  grass: patternFrom(['#.......','........','....#...','........']),
  hedge: patternFrom(['##.###.#','#.###.##','.###.###','###.###.','#.#####.','.###.#.#','###.###.','#.###.##']),
  stripe: patternFrom(['#','.']),
  gray25: patternFrom(['#...','....','..#.','....']),
};

/* ---------- sprites ---------- */
const FROG = bitmap([
  "  ##        ##  ",
  " #..#      #..# ",
  " #..# #### #..# ",
  "  ###......###  ",
  "    #.#..#.#    ",
  "   #.##..##.#   ",
  "   #........#   ",
  "  ##.#....#.##  ",
  " #..#......#..# ",
  " #..#.#..#.#..# ",
  "  ###......###  ",
  "    #......#    ",
  "   ##.####.##   ",
  "  #..#    #..#  ",
  " #..#      #..# ",
  "  ##        ##  ",
]);
const FROG_HOP = bitmap([
  " ##          ## ",
  "#..#        #..#",
  "#..#  ####  #..#",
  " ##.#......#.## ",
  "   ##.#..#.##   ",
  "   #.##..##.#   ",
  "   #........#   ",
  "   #.#....#.#   ",
  "  ##........##  ",
  " #..#.#..#.#..# ",
  "#..# #....# #..#",
  "#.#   #..#   #.#",
  "#.#   ####   #.#",
  "#.#          #.#",
  "#..#        #..#",
  " ##          ## ",
]);
const FROGS = [0,1,2,3].map(q=>rotated(FROG,q));
const FROGS_HOP = [0,1,2,3].map(q=>rotated(FROG_HOP,q));
const MINI_FROG = bitmap([
  " ##    ## ",
  "#..####..#",
  " #......# ",
  "  #.##.#  ",
  " #......# ",
  "#.#....#.#",
  " ##.##.## ",
  "  #    #  ",
]);
const SKULL = bitmap([
  "     ######     ",
  "   ##......##   ",
  "  #..........#  ",
  " #............# ",
  " #..###..###..# ",
  " #..###..###..# ",
  " #..###..###..# ",
  " #.......#....# ",
  "  #.....###..#  ",
  "   ##.......##  ",
  "    #.#.#.#.#   ",
  "    #.#.#.#.#   ",
  "     #######    ",
  "                ",
  "                ",
  "                ",
]);
const SPLASH = bitmap([
  "   #    #    #  ",
  " #   #     #    ",
  "    ..#  #..  # ",
  "  #.....##...   ",
  " #.#..#....#.#  ",
  "  ..#......#..  ",
  " #...#....#...# ",
  "  #..........#  ",
  "   ##......##   ",
  "     ######     ",
  "                ",
  "                ",
  "                ",
  "                ",
  "                ",
  "                ",
]);
const FLY = bitmap([
  " ##   ## ",
  "#..# #..#",
  "#...#...#",
  " #..#..# ",
  "  #.#.#  ",
  "   ###   ",
  "   #.#   ",
  "    #    ",
]);
const FROG_ICON = bitmap([
  " ##   ## ",
  "#..###..#",
  "#.#...#.#",
  " #.....# ",
  "#.#...#.#",
  " ##...## ",
  "  #####  ",
]);

/* ---------- layout ---------- */
const WIN = {x:95,y:26,w:322,h:313};
const CX = 96, CY = 46, CW = 320, CH = 292;
const CELL = 20, ROWS = 13, COLS = 16;
const PX = CX, PY = CY + 14;            // playfield origin
const PW = COLS*CELL;                   // 320
const MARGIN = 140, WRAP = PW + MARGIN*2;
const HOMES = [32,96,160,224,288];       // bay centers
const BAY_W = 24;
const ROW_HOME=0, ROW_MEDIAN=6, ROW_START=12;

/* ---------- audio ---------- */
let actx=null, soundOn=true;
function audio(){ if(!actx){ try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(actx&&actx.state==='suspended') actx.resume(); return actx; }
function tone(freq,dur,{type='square',vol=0.08,slide=0,delay=0}={}){
  if(!soundOn) return; const a=audio(); if(!a) return;
  const t=a.currentTime+delay, o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+0.02);
}
function noise(dur,{vol=0.12,lp=2000,delay=0}={}){
  if(!soundOn) return; const a=audio(); if(!a) return;
  const t=a.currentTime+delay, n=Math.floor(a.sampleRate*dur), b=a.createBuffer(1,n,a.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=a.createBufferSource(), f=a.createBiquadFilter(), g=a.createGain();
  s.buffer=b; f.type='lowpass'; f.frequency.value=lp; g.gain.value=vol;
  s.connect(f).connect(g).connect(a.destination); s.start(t);
}
const SFX = {
  hop(){ tone(520,0.06,{slide:380,vol:0.05}); },
  squash(){ noise(0.25,{lp:900,vol:0.18}); tone(160,0.3,{slide:-110,vol:0.07}); },
  splash(){ noise(0.45,{lp:2600,vol:0.14}); tone(700,0.25,{slide:-500,type:'triangle',vol:0.06}); },
  home(){ [523,659,784,1047].forEach((f,i)=>tone(f,0.09,{delay:i*0.07,vol:0.06})); },
  fly(){ [880,1175,1568].forEach((f,i)=>tone(f,0.07,{delay:i*0.05,vol:0.05})); },
  level(){ [392,523,659,784,659,784,1047].forEach((f,i)=>tone(f,0.12,{delay:i*0.1,vol:0.06})); },
  over(){ [523,494,466,440,415,392].forEach((f,i)=>tone(f,0.18,{delay:i*0.16,vol:0.06,type:'triangle'})); },
  tick(){ tone(1400,0.03,{vol:0.03}); },
  menu(){ tone(1000,0.02,{vol:0.03}); },
  extra(){ [659,784,988,1319].forEach((f,i)=>tone(f,0.1,{delay:i*0.08,vol:0.06})); },
};

/* ---------- lanes ---------- */
// kind: log | turtle | car | racer | dozer | truck
const LANE_DEFS = {
  1:{kind:'log',   len:4, v: 34, starts:[0,10,20]},
  2:{kind:'turtle',len:2, v:-46, starts:[0,6,12,18,24], dive:[1,3]},
  3:{kind:'log',   len:6, v: 66, starts:[0,13]},
  4:{kind:'log',   len:3, v: 26, starts:[0,8,15,23]},
  5:{kind:'turtle',len:3, v:-38, starts:[0,7,14,21], dive:[0,2]},
  7:{kind:'truck', len:2, v:-34, starts:[0,9,18]},
  8:{kind:'racer', len:1, v: 74, starts:[0,15]},
  9:{kind:'car',   len:1, v:-40, starts:[0,7,14,21]},
  10:{kind:'dozer',len:1, v: 30, starts:[0,6,12,20]},
  11:{kind:'car2', len:1, v:-38, starts:[0,8,16,24]},
};
const DIFF = {easy:0.8, normal:1, hard:1.3};
let difficulty='normal';
let lanes = {};
function buildLanes(level){
  lanes = {};
  const mul = DIFF[difficulty] * (1 + (level-1)*0.14);
  for(const r in LANE_DEFS){
    const d = LANE_DEFS[r];
    const objs = d.starts.map((s,i)=>({x:wrapX(s*CELL - MARGIN + (+r*173)%WRAP), len:d.len, dive: !!(d.dive && d.dive.includes(i)), phase: Math.random()*4}));
    // fewer logs at higher levels on hard rows
    if(level>=4 && d.kind==='log' && objs.length>2) objs.pop();
    lanes[r] = {row:+r, kind:d.kind, v:d.v*mul, objs};
  }
}
function wrapX(x){ return ((x+MARGIN)%WRAP+WRAP)%WRAP - MARGIN; }
function turtleState(o,t){
  if(!o.dive) return 0;
  const p=((t+o.phase)%4.2);
  if(p<2.4) return 0;          // up
  if(p<2.9) return 1;          // half
  if(p<3.6) return 2;          // under
  return 1;
}

/* ---------- game state ---------- */
let state='title';  // title | play | dying | clear | over
let paused=false;
let score=0, hi=0, lives=3, level=1, timeLeft=30, furthest=12, nextExtra=10000;
let homes=[false,false,false,false,false];
let fly={bay:-1,t:0,next:6};
let frog, deathT=0, deathKind='', msg='', msgT=0, clock=0, lastTick=0;
let menuOpen=-1, menuHover=-1, dialog=null;
try{ hi = +localStorage.getItem('frogger1bit.hi') || 0; }catch(e){}
try{ soundOn = localStorage.getItem('frogger1bit.sound')!=='off'; }catch(e){}
try{ difficulty = localStorage.getItem('frogger1bit.diff') || 'normal'; if(!DIFF[difficulty]) difficulty='normal'; }catch(e){}

function resetFrog(){
  frog = {x:7.5*CELL-CELL/2+CELL/2, row:ROW_START, dir:0, hop:0, fromX:0, fromRow:0, toX:0, toRow:0};
  frog.x = 7*CELL + 2; // left edge of 16px sprite in a 20px cell => cell 7 + 2
  timeLeft = 30; furthest = ROW_START; lastTick=0;
}
function newGame(){
  audio();
  score=0; lives=3; level=1; nextExtra=10000;
  homes=[false,false,false,false,false]; fly={bay:-1,t:0,next:6};
  buildLanes(level); resetFrog(); state='play'; paused=false;
  flash('LEVEL 1', 1.4);
}
function flash(t,d){ msg=t; msgT=d; }
function addScore(n){
  score+=n;
  if(score>=nextExtra){ nextExtra+=10000; if(lives<6){lives++; SFX.extra(); flash('EXTRA FROG!',1.4);} }
  if(score>hi){ hi=score; try{localStorage.setItem('frogger1bit.hi',hi);}catch(e){} }
}

/* ---------- input ---------- */
const DIRS = {up:[0,-1,0], right:[1,0,1], down:[0,1,2], left:[-1,0,3]};
let queued=null;
function press(k){
  if(dialog){ if(k==='start'||k==='enter'||k==='esc') closeDialog(); return; }
  if(menuOpen>=0){ if(k==='esc'){menuOpen=-1;} return; }
  if(k==='pause'){ if(state==='play'||state==='dying'||state==='clear'){ paused=!paused; SFX.menu(); } return; }
  if(k==='start'){
    if(state==='title'||state==='over') newGame();
    else if(paused) paused=false;
    return;
  }
  if(DIRS[k]){
    if(state==='title'||state==='over'){ return; }
    if(paused) return;
    if(state==='play'){ if(frog.hop>0) queued=k; else hop(k); }
  }
}
function hop(k){
  const [dx,dy,dir]=DIRS[k];
  frog.dir=dir;
  let nr = frog.row+dy;
  if(nr>ROW_START) return;
  let nx = frog.x + dx*CELL;
  if(nx<0 || nx>PW-16){ if(frog.row>=ROW_MEDIAN){ return; } }
  frog.fromX=frog.x; frog.fromRow=frog.row; frog.toX=nx; frog.toRow=nr; frog.hop=0.0001;
  SFX.hop();
}
const KEYMAP = {ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',
  Space:'start',Enter:'enter',KeyP:'pause',Escape:'esc'};
window.addEventListener('keydown',e=>{
  if(e.code==='KeyM'){ toggleSound(); return; }
  if((e.metaKey||e.ctrlKey) && e.code==='KeyN'){ e.preventDefault(); newGame(); return; }
  const k=KEYMAP[e.code]; if(!k) return;
  e.preventDefault(); audio();
  if(k==='enter'){ if(dialog) closeDialog(); else press('start'); return; }
  if(!e.repeat || DIRS[k]) { if(e.repeat && DIRS[k]) return; press(k); }
});
document.querySelectorAll('#pad button').forEach(b=>{
  b.addEventListener('pointerdown',e=>{e.preventDefault();audio();press(b.dataset.k);});
});
// swipe on canvas
let touchStart=null;
cv.addEventListener('pointerdown',e=>{
  audio();
  const p=toCanvas(e);
  if(e.pointerType!=='mouse') touchStart={x:e.clientX,y:e.clientY,p};
  onMouseDown(p);
});
cv.addEventListener('pointermove',e=>{ onMouseMove(toCanvas(e), e.buttons&1); });
cv.addEventListener('pointerup',e=>{
  const p=toCanvas(e);
  if(touchStart && e.pointerType!=='mouse'){
    const dx=e.clientX-touchStart.x, dy=e.clientY-touchStart.y;
    if(Math.hypot(dx,dy)>24 && menuOpen<0 && !dialog){
      press(Math.abs(dx)>Math.abs(dy) ? (dx>0?'right':'left') : (dy>0?'down':'up'));
      touchStart=null; return;
    }
    touchStart=null;
  }
  onMouseUp(p);
});
function toCanvas(e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)*SW/r.width, y:(e.clientY-r.top)*SH/r.height}; }

/* ---------- menus & dialogs ---------- */
const MENUS = [
  {title:null, icon:true, x:10, items:[{t:'About Frogger…', a:()=>about()}]},
  {title:'File', x:36, items:[{t:'New Game', key:'N', a:newGame},{t:'Pause', key:'P', a:()=>press('pause'), on:()=>paused},{t:'-'},{t:'Quit to Title', a:()=>{state='title';paused=false;}}]},
  {title:'Game', x:76, items:[
    {t:'Sound', key:'M', a:()=>toggleSound(), on:()=>soundOn},{t:'-'},
    {t:'Easy', a:()=>setDiff('easy'), on:()=>difficulty==='easy'},
    {t:'Normal', a:()=>setDiff('normal'), on:()=>difficulty==='normal'},
    {t:'Hard', a:()=>setDiff('hard'), on:()=>difficulty==='hard'}]},
  {title:'Help', x:124, items:[{t:'How to Play…', a:()=>howTo()},{t:'High Score…', a:()=>showDialog(['High score: '+String(hi).padStart(5,'0'),'','Saved in this browser.'])}]},
];
function setDiff(d){ difficulty=d; try{localStorage.setItem('frogger1bit.diff',d);}catch(e){} buildLanes(level); flash(d.toUpperCase()+' MODE',1.2); }
function toggleSound(){ soundOn=!soundOn; try{localStorage.setItem('frogger1bit.sound',soundOn?'on':'off');}catch(e){} if(soundOn) SFX.menu(); }
function about(){ showDialog(['FROGGER','A 1-bit compact Mac recreation','of the 1981 arcade classic.','','Graphics and sounds are drawn','and synthesized in code.']); }
function howTo(){ showDialog(['Hop each frog across the road','and river into the 5 bays at top.','','Ride logs and turtles. Diving','turtles sink! Cars squash you.','Catch flies for 200 bonus points.','','Arrows/WASD hop · P pause · M sound']); }
function showDialog(lines){ dialog={lines}; menuOpen=-1; if(state==='play') paused=true; }

function menuWidth(m){ return m.icon?20: textW(m.title)+16; }
function dropRect(i){
  const m=MENUS[i]; let w=0;
  m.items.forEach(it=>{ w=Math.max(w,textW(it.t)+(it.key?40:20)+18); });
  return {x:m.x-2, y:20, w:Math.max(w,110), h:m.items.reduce((s,it)=>s+(it.t==='-'?8:16),0)+4};
}
function hitMenuTitle(p){
  if(p.y>19) return -1;
  for(let i=0;i<MENUS.length;i++){ const m=MENUS[i]; if(p.x>=m.x-4 && p.x<m.x-4+menuWidth(m)) return i; }
  return -1;
}
function hitMenuItem(p){
  if(menuOpen<0) return -1; const r=dropRect(menuOpen);
  if(p.x<r.x||p.x>r.x+r.w||p.y<r.y||p.y>r.y+r.h) return -1;
  let y=r.y+2; const items=MENUS[menuOpen].items;
  for(let i=0;i<items.length;i++){ const h=items[i].t==='-'?8:16; if(p.y>=y&&p.y<y+h) return items[i].t==='-'?-1:i; y+=h; }
  return -1;
}
let mouseDownAt=0, okRect=null;
function onMouseDown(p){
  if(dialog){ return; }
  const t=hitMenuTitle(p);
  if(t>=0){ menuOpen = (menuOpen===t)? -1 : t; menuHover=-1; mouseDownAt=performance.now(); SFX.menu(); return; }
  if(menuOpen>=0){ const it=hitMenuItem(p); if(it<0){ menuOpen=-1; } return; }
  if(state==='title'||state==='over'){ newGame(); }
}
function onMouseMove(p,held){
  if(menuOpen>=0){ const t=hitMenuTitle(p); if(held && t>=0 && t!==menuOpen){ menuOpen=t; } menuHover=hitMenuItem(p); }
}
function onMouseUp(p){
  if(dialog){ if(okRect && p.x>=okRect.x-4&&p.x<=okRect.x+okRect.w+4&&p.y>=okRect.y-4&&p.y<=okRect.y+okRect.h+4) closeDialog(); return; }
  if(menuOpen>=0){
    const it=hitMenuItem(p);
    if(it>=0){ const item=MENUS[menuOpen].items[it]; menuOpen=-1; SFX.menu(); item.a(); }
    else if(hitMenuTitle(p)<0 && performance.now()-mouseDownAt>250) menuOpen=-1;
  }
}

/* ---------- update ---------- */
function update(dt){
  clock += dt;
  if(msgT>0) msgT-=dt;
  if(dialog || menuOpen>=0 || paused) return;
  if(state==='title'||state==='over'){ // attract mode traffic
    for(const r in lanes){ const L=lanes[r]; L.objs.forEach(o=>o.x=wrapX(o.x+L.v*dt)); }
    return;
  }
  for(const r in lanes){ const L=lanes[r]; L.objs.forEach(o=>o.x=wrapX(o.x+L.v*dt)); }

  // fly
  fly.next-=dt;
  if(fly.bay>=0){ fly.t-=dt; if(fly.t<=0){ fly.bay=-1; fly.next=5+Math.random()*5; } }
  else if(fly.next<=0){ const free=homes.map((h,i)=>h?-1:i).filter(i=>i>=0); if(free.length){ fly.bay=free[Math.floor(Math.random()*free.length)]; fly.t=5; } else fly.next=4; }

  if(state==='dying'){ deathT-=dt; if(deathT<=0) afterDeath(); return; }
  if(state==='clear'){ deathT-=dt; if(deathT<=0){ level++; homes=[false,false,false,false,false]; buildLanes(level); resetFrog(); state='play'; flash('LEVEL '+level,1.4);} return; }

  // timer
  timeLeft-=dt;
  if(timeLeft<8){ const s=Math.ceil(timeLeft); if(s!==lastTick){ lastTick=s; SFX.tick(); } }
  if(timeLeft<=0){ timeLeft=0; die('time'); return; }

  // hop animation
  if(frog.hop>0){
    frog.hop += dt/0.11;
    if(frog.hop>=1){
      frog.hop=0; frog.x=frog.toX; frog.row=frog.toRow;
      landed();
      if(state!=='play') return;
      if(queued){ const q=queued; queued=null; hop(q); }
    } else {
      frog.x = frog.fromX + (frog.toX-frog.fromX)*frog.hop;
    }
  }

  // ride the river
  const L = lanes[frog.row];
  const isRiver = frog.row>=1 && frog.row<=5;
  if(isRiver && L && frog.hop===0){
    const ride = riding(L);
    if(!ride){ die('splash'); return; }
    frog.x += L.v*dt;
    const c=frog.x+8;
    if(c<0||c>PW){ die('splash'); return; }
  } else if(isRiver && L && frog.hop>0 && frog.fromRow===frog.toRow){
    // hopping sideways on a log: drift with it
    frog.fromX += L.v*dt; frog.toX += L.v*dt;
  }
  // traffic: only a real, visible overlap counts, and mid-hop we check
  // the lane the frog is actually in on screen (old lane first half, new lane second half)
  const vr = frog.hop>0 ? (frog.hop<0.5 ? frog.fromRow : frog.toRow) : frog.row;
  const TL = lanes[vr];
  if(vr>=7 && vr<=11 && TL){
    const fl=frog.x+4, fr=frog.x+12;           // frog's body, not its toes
    for(const o of TL.objs){
      const vl=o.x+4, vrt=o.x+o.len*CELL-4;     // vehicle's body, not its bumpers
      if(fr>vl && fl<vrt){ frog.row=vr; die('squash'); return; }
    }
  }
}
function riding(L){
  const c=frog.x+8;
  for(const o of L.objs){
    if(c>o.x+1 && c<o.x+o.len*CELL-1){
      if(L.kind==='turtle' && turtleState(o,clock)===2) continue;
      return o;
    }
  }
  return null;
}
function landed(){
  if(frog.row<furthest){ furthest=frog.row; addScore(10); }
  if(frog.row===ROW_HOME){
    const c=frog.x+8;
    for(let i=0;i<5;i++){
      if(Math.abs(c-HOMES[i])<=BAY_W/2){
        if(homes[i]){ die('squash'); return; }
        homes[i]=true; frog.x=HOMES[i]-8;
        let bonus = 50 + Math.floor(timeLeft)*10;
        if(fly.bay===i){ bonus+=200; fly.bay=-1; fly.next=6; SFX.fly(); flash('FLY! +200',1.2); }
        addScore(bonus); SFX.home();
        if(homes.every(Boolean)){ addScore(1000); SFX.level(); state='clear'; deathT=2.2; flash('ALL HOME! +1000',2.2); }
        else resetFrog();
        return;
      }
    }
    die('squash'); return;
  }
  if(frog.row>=1&&frog.row<=5){
    const L=lanes[frog.row]; if(!riding(L)){ die('splash'); }
  }
}
function die(kind){
  state='dying'; deathKind=kind; deathT=1.3; queued=null; frog.hop=0;
  frog.x=Math.max(0,Math.min(PW-16,frog.x));
  if(kind==='splash') SFX.splash(); else SFX.squash();
  if(kind==='time') flash('TIME UP!',1.3);
}
function afterDeath(){
  lives--;
  if(lives<=0){ state='over'; SFX.over(); return; }
  resetFrog(); state='play';
}

  okRect=null;
  if(dialog){
    const lines=dialog.lines, w=280, h=40+lines.length*14+30, x=SW/2-w/2, y=SH/2-h/2+6;
    box(x,y,w,h);
    ctx.drawImage(FROGS[0],x+16,y+16);
    lines.forEach((l,i)=>text(l,x+46,y+28+i*14,{size:i===0&&lines[0]==='FROGGER'?13:11}));
    okRect={x:x+w-74,y:y+h-30,w:58,h:20};
    roundBtn(okRect.x,okRect.y,okRect.w,okRect.h,'OK',true);
  }
}
function threshold(){
  const d=ctx.getImageData(0,0,SW,SH),a=d.data;
  for(let i=0;i<a.length;i+=4){ const v=(a[i]*3+a[i+1]*4+a[i+2])>>3; const b=v<150?0:255; a[i]=a[i+1]=a[i+2]=b; a[i+3]=255; }
  ctx.putImageData(d,0,0);
}
function render(){
  drawDesktop();
  drawWindow();
  drawBackdrop();
  drawHomes();
  drawLanes();
  drawFrog();
  drawOverlays();
  drawMenuBar();
  threshold();
  dctx.imageSmoothingEnabled = false;
  dctx.drawImage(buf, 0, 0, cv.width, cv.height);
}

/* ---------- loop ---------- */
buildLanes(1); resetFrog();
let last=performance.now();
function loop(now){
  const dt=Math.max(0,Math.min(0.05,(now-last)/1000)); last=now;
  update(dt); render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
document.addEventListener('visibilitychange',()=>{ if(document.hidden && state==='play') paused=true; });
})();
</script>
</body>
</html>
